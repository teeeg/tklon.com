name: ci

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "generator/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "site/**"
      - "generator/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Only GitHub-/AWS-official actions here — no independent-maintainer actions.
# Dependabot keeps them on the latest secure version (.github/dependabot.yml).
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The binary reads site content at runtime, so publishing a post never
      # changes it. Keyed on the generator sources alone: a content-only merge
      # restores 30 MB and skips cargo, rustup and nasm entirely.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: tklon
        with:
          path: target/release/tklon
          key: tklon-${{ runner.os }}-${{ hashFiles('generator/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml') }}

      # rav1e assembles its x86_64 SIMD with nasm, which the runner lacks.
      - name: Install nasm
        if: steps.tklon.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y nasm

      # rustup + rust-toolchain.toml (pinned 1.94.0) provide the compiler.
      # --locked builds the exact versions in Cargo.lock.
      - name: Build the binary
        if: steps.tklon.outputs.cache-hit != 'true'
        run: cargo build --release --locked

      - name: Build the site
        run: ./target/release/tklon build

      # Hand the deploy the exact bytes that were built here, rather than
      # rebuilding them in a second job.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: build/
          retention-days: 1

  # The generator's own tests: pure unit tests with no built site, so this runs
  # alongside `build` rather than behind it.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Separate cache from `build`: that one stores the finished release binary,
      # this one the debug artifacts a test build needs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: test-${{ runner.os }}-${{ hashFiles('generator/**', 'Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: test-${{ runner.os }}-

      # Advisory: reports formatting drift without failing the job, so a missed
      # `make fmt` never stands between a post and a deploy. Runs before the
      # dependency build because rustfmt needs no compile. Covers every
      # workspace member, site/e2e included.
      - name: Check formatting
        run: cargo fmt --check
        continue-on-error: true

      # rav1e assembles its x86_64 SIMD with nasm, which the runner lacks.
      - name: Install nasm
        run: sudo apt-get update && sudo apt-get install -y nasm

      - name: Run generator tests
        run: cargo test --locked -p generator

  # Link checks for this site's built output. Needs the artifact `build`
  # produced, so it can't start until that finishes — but it does not compile the
  # generator: site/e2e deliberately doesn't depend on it, so this pulls in only
  # ureq and skips the heavy image-encoder tree (and nasm with it).
  e2e:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: build

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: e2e-${{ runner.os }}-${{ hashFiles('site/e2e/**', 'Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: e2e-${{ runner.os }}-

      - name: Check links
        run: cargo test --locked -p e2e

  # Master only: a pull request runs the three jobs above and stops there.
  deploy:
    needs: [build, test, e2e]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # OIDC: assume the AWS deploy role with a short-lived token (no stored keys).
    # Scoped to this job, so the PR-triggered build is never issued one.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: build

      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: arn:aws:iam::295005258746:role/tklondotcom-GitHubActionsDeployRole-KmJpDGB6eg8r
          aws-region: us-east-1

      - name: Sync to S3 and invalidate CloudFront
        run: |
          # Two-pass sync so each bucket of files gets the right Cache-Control:
          #   1. Hashed/immutable assets (CSS, JS, images, fonts) — 1y immutable.
          #      The filename embeds a content hash, so a content change always
          #      ships under a new URL; serving it forever is safe.
          #   2. HTML / feeds — short edge TTL with stale-while-revalidate, so
          #      users never wait on revalidation and updates land in ~5 min.
          # --exclude 'media/*' and 'masters/*': self-hosted videos and the photo
          # originals are uploaded out-of-band and never live in build/; without
          # these, --delete would remove them.
          # Hashed assets ship first so HTML never references a missing file.
          aws s3 sync build/ s3://tklon.com-assets --delete \
            --exclude 'media/*' --exclude 'masters/*' \
            --exclude '*.html' --exclude '*.xml' --exclude '*.txt' \
            --cache-control 'public,max-age=31536000,immutable'
          aws s3 sync build/ s3://tklon.com-assets --delete --exclude '*' \
            --include '*.html' --include '*.xml' --include '*.txt' \
            --cache-control 'public,max-age=60,s-maxage=300,stale-while-revalidate=86400'
          # `/*` — a wildcard only acts as one as the last character, so a path
          # like '/*.html' matches a file literally named that, i.e. nothing.
          # One path, and the free tier covers 1000 a month.
          aws cloudfront create-invalidation --distribution-id E12C54H3GMYHN0 \
            --paths '/*'
